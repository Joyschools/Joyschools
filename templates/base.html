<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">T</span><span>{{ app_name }}</span></a>
    <nav class="desktop-nav">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('browse', kind='movie') }}">Movies</a>
      <a href="{{ url_for('browse', kind='tv') }}">TV Shows</a>
      <a href="{{ url_for('browse') }}">Library</a>
    </nav>
    <div class="nav-actions">
      <form class="search-mini" action="{{ url_for('browse') }}" method="get">
        <span>⌕</span><input name="q" placeholder="Search movies & shows..." autocomplete="off"><button type="submit">Search</button>
      </form>
      {% if signed_in_user %}<a class="join-chip" href="{{ url_for('leave') }}" title="Sign out">Account</a>{% else %}<a class="join-chip" href="{{ url_for('join') }}">Join</a>{% endif %}
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <nav class="mobile-nav">
    <a href="{{ url_for('home') }}"><span>⌂</span>Home</a>
    <a href="{{ url_for('browse', kind='movie') }}"><span>▶</span>Movies</a>
    <a href="{{ url_for('browse', kind='tv') }}"><span>▤</span>TV</a>
    <a href="{{ url_for('browse') }}"><span>⌕</span>Search</a>
  </nav>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
